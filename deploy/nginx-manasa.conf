# /etc/nginx/sites-available/manasa.conf
# web.teknulugycard.com  ->  Manasa site + /admin  (Node on 127.0.0.1:4100)
# Uses the existing wildcard certificate for *.teknulugycard.com (lego).
# HTTP -> HTTPS is already handled by teknulugycard.conf (*.teknulugycard.com on port 80).
# An exact server_name wins over the *.teknulugycard.com card block, so cards are unaffected.

server {
    listen 443 ssl;
    server_name web.teknulugycard.com;

    ssl_certificate     /etc/lego/certificates/wildcard-teknulugycard.crt;
    ssl_certificate_key /etc/lego/certificates/wildcard-teknulugycard.key;

    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
